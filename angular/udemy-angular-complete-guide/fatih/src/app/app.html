
<app-header></app-header>
<main>
  <ul id="users">
    @for (user of users; track user.id) {
  
      <!--<li *ngFor="let user of users"> --->
      <li>  
        <app-user [user]="user" [selected]="user.id === selectedUserId" (select)="onSelectUser($event)"></app-user>
      </li>
    }
  </ul>


  @if (selectedUser) {
    <app-tasks [name]="selectedUser.name" [userId]="selectedUser.id" />
  } @else {
    <p id="fallback">Select a user please</p>
  }

  <!-- oldschool with ngIf:  
  <app-tasks *ngIf="selectedUser; else fallback" [name]="selectedUser!.name" />
  <ng-template #fallback>
    <p id="fallback">Select a user please</p>
  </ng-template>
-->

</main>
